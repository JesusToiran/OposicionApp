# Candidato para /etc/nginx/snippets/oposiciontai-proxy.conf.
proxy_pass http://127.0.0.1:8080;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host mercamento.com;
proxy_set_header X-Forwarded-Host mercamento.com;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Forwarded-Proto https;
# Sobrescribir los valores del cliente; no concatenar cabeceras no confiables.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Prefix "";
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
proxy_redirect default;
# HSTS lo emite Nginx también en respuestas que no llegan a Spring Security.
proxy_hide_header Strict-Transport-Security;
