# Candidato; revisar contra el sitio existente antes de instalar.
# Se incluye en el contexto http de Nginx, como sites-enabled en Ubuntu.
limit_req_zone $binary_remote_addr zone=oposiciontai_requests:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=oposiciontai_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=oposiciontai_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name mercamento.com www.mercamento.com;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    access_log /var/log/nginx/oposiciontai_access.log;
    error_log /var/log/nginx/oposiciontai_error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/oposiciontai;
        try_files $uri =404;
    }
    location / {
        return 308 https://mercamento.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mercamento.com www.mercamento.com;
    server_tokens off;

    # Confirmar el nombre real de la línea de certificado ya existente.
    ssl_certificate /etc/letsencrypt/live/mercamento.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mercamento.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:oposiciontai_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    access_log /var/log/nginx/oposiciontai_access.log;
    error_log /var/log/nginx/oposiciontai_error.log warn;

    client_max_body_size 1m;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_conn oposiciontai_connections 20;
    limit_conn_status 429;
    limit_req_status 429;

    location = /login {
        limit_req zone=oposiciontai_login burst=5 nodelay;
        include /etc/nginx/snippets/oposiciontai-proxy.conf;
    }
    location / {
        limit_req zone=oposiciontai_requests burst=20 nodelay;
        include /etc/nginx/snippets/oposiciontai-proxy.conf;
    }
    location ~ /\. {
        deny all;
    }
}
