name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties
      - name: Validar Compose sin credenciales
        run: docker compose config --no-interpolate --quiet
      - name: Construir imagen local sin publicar
        run: docker build --tag oposicionapp:ci .
      - name: Compilar y ejecutar pruebas con Testcontainers e imagen Docker
        run: sh ./mvnw -B -ntp -Doposicionapp.test.image=oposicionapp:ci verify
