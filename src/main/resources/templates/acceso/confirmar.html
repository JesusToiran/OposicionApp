<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Confirmar acceso · OposicionApp</title><link rel="stylesheet" th:href="@{/css/acceso.css}"><script th:src="@{/js/acceso.js}" defer></script></head><body><main class="acceso"><span class="marca">OposicionApp</span><h1 th:text="${verificar ? 'Confirma tu correo.' : 'Elige tu contraseña.'}"></h1><p>El enlace es temporal y solo puede utilizarse una vez.</p><form id="confirmar-acceso" th:action="@{/auth/correo}" method="post"><input type="hidden" id="token" name="token"><th:block th:unless="${verificar}"><label for="clave">Nueva contraseña</label><input id="clave" name="clave" type="password" autocomplete="new-password" minlength="15" maxlength="128" required><p class="nota">Utiliza de 15 a 128 caracteres. Puedes escribir una frase larga.</p></th:block><button id="confirmar" disabled th:text="${verificar ? 'Verificar mi correo' : 'Guardar contraseña'}"></button></form><p id="enlace-invalido" class="aviso" role="alert" hidden>El enlace no es válido. Solicita uno nuevo.</p><noscript>Activa JavaScript para utilizar el enlace recibido por correo.</noscript></main></body></html>
