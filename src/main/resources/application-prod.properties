spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${APP_DB_USER}
spring.datasource.password=${APP_DB_PASSWORD}
spring.flyway.user=${FLYWAY_DB_USER}
spring.flyway.password=${FLYWAY_DB_PASSWORD}
spring.devtools.restart.enabled=false
spring.thymeleaf.cache=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.forward-headers-strategy=none
# Credenciales externas obligatorias mientras no exista la autenticación del MVP.
spring.security.user.name=${SECURITY_USER}
spring.security.user.password=${SECURITY_PASSWORD}
