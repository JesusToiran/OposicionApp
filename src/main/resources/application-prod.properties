spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${APP_DB_USER}
spring.datasource.password=${APP_DB_PASSWORD}
spring.flyway.user=${FLYWAY_DB_USER}
spring.flyway.password=${FLYWAY_DB_PASSWORD}
spring.devtools.restart.enabled=false
spring.thymeleaf.cache=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.name=__Host-OPOSICIONAPP_SESSION
server.servlet.session.cookie.path=/
server.address=${SERVER_ADDRESS:127.0.0.1}
server.tomcat.redirect-context-root=false
oposicionapp.auth.https-obligatorio=true
oposicionapp.auth.origen-publico=${APP_PUBLIC_ORIGIN}
server.forward-headers-strategy=native
# Solo la puerta de enlace por la que llega Nginx nativo; nunca todas las redes privadas.
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_CIDR}
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.host-header=X-Forwarded-Host
server.tomcat.remoteip.port-header=X-Forwarded-Port
server.servlet.session.timeout=20m
server.servlet.session.tracking-modes=cookie
server.tomcat.threads.max=64
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=256
server.tomcat.accept-count=64
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
