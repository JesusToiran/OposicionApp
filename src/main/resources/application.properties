spring.application.name=OposicionApp
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
logging.level.root=INFO
# La contraseña temporal de Spring Security no debe aparecer en los logs.
logging.level.org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration=ERROR
