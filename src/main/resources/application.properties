spring.application.name=OposicionApp
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
logging.level.root=INFO
# La contraseña temporal de Spring Security no debe aparecer en los logs.
logging.level.org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration=ERROR
server.address=127.0.0.1
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=OPOSICIONAPP_SESSION_LOCAL
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.path=/
server.tomcat.max-http-form-post-size=8KB
oposicionapp.auth.https-obligatorio=true
